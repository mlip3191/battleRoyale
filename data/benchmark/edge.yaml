# Edge-case set for the benchmark (#136). See docs/benchmark.md, "Edge-case set".
# Every expected result here is a judgment call, labeled "assumption: <reason>", never a
# sourced fact. Pass rules were written before any run, and this set is reported separately.

matchups:
# --- Swarms on both sides of 200 per side: the same matchup at ~150 and ~300 -------------------
# These pairs were picked by scanning engine output on the seed sheets for close fights (#427),
# so their expected winner is a consistency check, not independent evidence.
- id: edge-swarm-01a
  group: swarm
  fighters:
    - {entity: roman-legionary, count: 150, variant: null}
    - {entity: african-lion, count: 1, variant: null}
  terrain: open_field
  expected_winner: "0"
  confidence: medium
  source: "assumption: 150 armored, organized soldiers beat one lion, but not every time"

- id: edge-swarm-01b
  group: swarm
  fighters:
    - {entity: roman-legionary, count: 300, variant: null}
    - {entity: african-lion, count: 1, variant: null}
  terrain: open_field
  expected_winner: "0"
  confidence: medium
  source: "assumption: twice the soldiers should win at least as often"

- id: edge-swarm-02a
  group: swarm
  fighters:
    - {entity: gorilla, count: 150, variant: null}
    - {entity: african-elephant, count: 1, variant: null}
  terrain: open_field
  expected_winner: "0"
  confidence: medium
  source: "assumption: 150 gorillas overwhelm one elephant, though an elephant is no pushover"

- id: edge-swarm-02b
  group: swarm
  fighters:
    - {entity: gorilla, count: 300, variant: null}
    - {entity: african-elephant, count: 1, variant: null}
  terrain: open_field
  expected_winner: "0"
  confidence: medium
  source: "assumption: twice the gorillas should win at least as often"

