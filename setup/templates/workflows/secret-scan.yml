# Secret scan - server-side backstop for keys and .env files.
# Runs on GitHub, so it still catches leaks if someone's local hook was
# skipped or never installed. Make "Secret scan" a required status check.
# CRITICAL FILE: changes need PM approval.
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write   # lets gitleaks comment on the PR line with the leak

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history so every commit in the PR is scanned

      # 1. Block secret FILES by name (no setup needed).
      - name: Block .env and key files
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD")
          bad=$(printf '%s\n' "$files" \
            | grep -E '(^|/)(\.env(\..+)?|.+\.env|\.envrc|.+\.(pem|key|p8|p12|pfx|jks|keystore|ppk|tfvars|tfstate)|id_(rsa|dsa|ecdsa|ed25519).*|credentials\.json|client_secret.*\.json|.*service-account.*\.json|secrets\.(json|ya?ml|toml))$' \
            | grep -vE '(^|/)\.env\.(example|sample|template)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::These files must never be committed:"
            echo "$bad"
            echo "Remove them from the branch, and tell the PM so any real key in them is replaced."
            exit 1
          fi
          echo "No secret files found in this PR."

      # 2. Scan the CONTENTS of every commit for key-shaped text.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No GITLEAKS_LICENSE needed: this repo is owned by a personal account.
          # If it ever moves to an organization, add a free license from gitleaks.io
          # as the repo secret GITLEAKS_LICENSE and pass it here.
