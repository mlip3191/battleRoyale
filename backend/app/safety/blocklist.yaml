  reason: hate
  # Present-day nationalities, ethnic groups, and religions as nouns for people. Left out on
  # purpose because they also name animals, things, or allowed archetypes: Persian, Siamese,
  # Burmese, Himalayan, Maltese, Bengal, Afghan, Arabian, Arab, Dalmatian, Swede, Pole, Dane,
