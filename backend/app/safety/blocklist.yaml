# Safety code rules (A04): words and phrases that clearly name people the app never puts in the
# ring. Read by backend/app/safety/rules.py. Only clear human cases live here; anything
# ambiguous ("kid" is also a young goat, "a Persian" is also a cat) is left to the classifier.
# Categories and patterns only: no slurs are spelled out, and none are needed.
#
# How a side is read: lowercase, hyphens become spaces, anything after "in", "on", "at", "with"
# (and similar) is dropped, and the last word left is the side's head noun ("a baby elephant in
# the snow" -> head "elephant").
#
#   anywhere:   a word or phrase that blocks wherever it appears ("toddler").
#   head:       blocks only as the head noun, so "a baby" is blocked but "a baby elephant",
#               "a German shepherd" and "a Bengal tiger" are not.
#   with_people: blocks when the head noun is one of people_words and a word from head comes
#               earlier in the side ("French people", "Japanese women").

minor:
  reason: minor
  anywhere:
    - toddler
    - toddlers
    - preschooler
    - preschoolers
    - kindergartner
    - kindergartners
    - kindergartener
    - kindergarteners
    - schoolchild
    - schoolchildren
