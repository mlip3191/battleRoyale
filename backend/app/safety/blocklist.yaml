    - middle schooler
    - middle schoolers
    - high schooler
    - high schoolers
    - boy scout
    - boy scouts
    - girl scout
    - girl scouts
    - cub scout
    - cub scouts
  head:
    - baby
    - babies
    - infant
    - infants
    - newborn
    - newborns
    - child
    - children
    - boy
    - boys
    - girl
    - girls
