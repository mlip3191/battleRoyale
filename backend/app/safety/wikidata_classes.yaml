# Wikidata classes that block a fighter (A04 part 2, DECISIONS D-38). Read by safety/wikidata.py.
#
# A name is blocked when its top exact Wikidata match is an instance (P31) or subclass (P279) of
# one of these classes, directly or up to two P279 levels higher. instance_only classes match
# only the entity's own P31 (so the class "Roman legionary" is never a real person).
# individuals_only classes match only an item that is not a kind of thing (see kind_matches).
#
# Bump classes_version whenever this list changes: cached lookups from an older version are
# ignored, so the change takes effect at once.
#
# Each Q-ID was verified live 2026-11-10 against wbgetentities or Special:EntityData; label is
# the live English label.
#
# Religious figures need no class of their own: they are humans (Q5), so real_person covers them.
#
# Version 3 (A04 part 3a): demote_matches, bands as real_person, weapons of mass destruction.
# Version 4 (A04 part 3a fixes): kind_matches, band subtypes, given-name variants; bands yield
# only to a kind item, and the cache stores whether the pick was a band.
# Version 5 (A04 part 3a fix round 2): the cache also stores whether a band's name is a common
# word, which changes how cached band picks block.
# Version 6 (A04 part 3b): geographic location is individuals_only (live "vending machine" is a
# subclass of shop -> workplace -> geographic location), and the cache also stores the first
# kind item for common nouns ("a wolverine": the animal, not the comic-book character).
classes_version: 6

# Name and meta items. When picking the top exact match, an item whose P31 (instance of) is only
# these classes is skipped and the next exact match is used: "Moon" the family name is passed
# over for the Moon, "Thor" the male given name for the god. Verified live 2026-11-10 against
# wbgetentities (labels as returned).
skip_matches:
  - qid: Q101352
    label: family name
  - qid: Q29042997
    label: double family name
  - qid: Q202444
    label: given name
  - qid: Q12308941
    label: male given name
  - qid: Q11879590
    label: female given name
  - qid: Q3409032
    label: unisex given name
  - qid: Q4167410
    label: Wikimedia disambiguation page
  - qid: Q22808320
    label: Wikimedia human name disambiguation page

# Kind items: an exact match is a kind (a type of thing, not one individual) when it has a P279
# (subclass of) value or its P31 includes one of these classes. A band is passed over only when a
# kind item is among the exact matches ("Grizzly Bear" the band for the grizzly bear), never for
# another individual ("the Beatles" the band beats the asteroid "8749 Beatles"). Verified live
# 2026-11-10 against wbgetentities (labels as returned).
kind_matches:
  - qid: Q16521
    label: taxon
  - qid: Q55983715
    label: organisms known by a particular common name # the live "raven"

# Creative works that share a name with a fighter. When picking the top exact match, an item whose
# P31 is only these classes (or band classes, see "band: true" below) is passed over if another
# usable exact match is left: "Dragon" the magazine for the dragon. A creative work is used only
# if nothing else fits. Verified live 2026-11-10 against Special:EntityData (labels as returned).
demote_matches:
