  # individuals_only: blocks only an item that is not a kind of thing (no P279, no kind P31).
  # Individual places reach it (live Paris, London, Antarctica, Times Square, the Mississippi
  # River); kinds of objects can too, through Wikidata's "place of business" classes (live
  # "vending machine" -> shop -> workplace -> geographic location), and must stay allowed. Kinds
  # of landforms ("a mountain", "a desert") still block through landform below.
  - qid: Q2221906
    label: geographic location
    reason: out_of_scope
    individuals_only: true
  - qid: Q271669
    label: landform
    reason: out_of_scope
  - qid: Q7184903
    label: abstract entity
    reason: out_of_scope
