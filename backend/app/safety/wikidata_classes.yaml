classes:
  - qid: Q5
    label: human
    reason: real_person
    instance_only: true
  # Bands and sports teams are groups of real people (D-38, D-59); group classes must have
  # reason real_person. Group classes (group: band or group: team) count only on the item's own
  # P31, are demoted like creative works but yield only to a kind item (see kind_matches), and
  # block only when typed as "the" + the group's name ("the Eagles", "the Lakers"), or as the
  # bare name when its singular is not a kind item ("Beatles" and "Lakers" block; "Eagles",
  # "eagles", "Bulls" and "a grizzly bear" do not). Capitals must match the name, or the name
  # must be ALL CAPS ("THE BEATLES"). A band's name is its label; a team's may also be the alias
  # that matched ("Lakers" for "Los Angeles Lakers"). A group that lost the pick to a
  # common-word kind item blocks only as its full name with its own "The" ("the Police"; not
  # "the Grizzly Bear"). Other organizations, companies and brands stay allowed (a Jeep).
  # Subtypes are listed because only the item's own P31 counts. Bands verified live 2026-11-10
