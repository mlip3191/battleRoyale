[project]
name = "battle-royale-backend"
version = "0.1.0"
description = "Battle Royale: The Science-Backed Fight Simulator (backend)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "sqlite-vec>=0.1.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
