- name: reply wrapped in a code fence
  text: a lion vs a tiger
  replies:
    - "```json\n{\"fighters\": [{\"raw\": \"a lion\", \"entity\": \"lion\"}, {\"raw\": \"a tiger\", \"entity\": \"tiger\"}]}\n```"
  expect:
    status: ok
    calls: 1
    fighters:
      - {entity: lion}
      - {entity: tiger}

- name: broken output, then a good retry
  text: a badger vs a cobra
  replies:
    - "this is not JSON"
    - fighters:
        - {raw: a badger, entity: badger}
        - {raw: a cobra, entity: cobra}
  expect:
    status: ok
    calls: 2

- name: invented words, then a good retry
  text: a wolverine vs a lynx
  replies:
    - fighters:
        - {raw: a hungry wolverine, entity: wolverine}
        - {raw: a lynx, entity: lynx}
    - fighters:
        - {raw: a wolverine, entity: wolverine}
        - {raw: a lynx, entity: lynx}
  expect:
    status: ok
    calls: 2
    fighters:
      - {entity: wolverine}
      - {entity: lynx}

- name: broken output twice
  text: a shark vs a squid
  replies:
    - "not JSON"
    - fighters: "also wrong"
  expect:
    status: clarify
    calls: 2
    question_include: [another way]
