# Intake test cases (A02). Each case has:
#   text:    what the user typed
#   replies: what the stand-in chat model sends back, one per call, in order
#            (a mapping is sent as JSON; a string is sent as-is, e.g. broken output)
#   expect:  what parse_matchup must return. Keys checked when present:
#            status, terrain, fighters (only the listed fields), assumptions_include
#            (substrings, any case), no_assumptions, options_count, options_include,
#            question_include, message_include, calls (number of model calls)

- name: duck-sized horses vs horse-sized duck
  text: 100 duck-sized horses vs 1 horse-sized duck
  replies:
    - fighters:
        - {raw: 100 duck-sized horses, entity: horse, count: 100, size_reference: duck}
        - {raw: 1 horse-sized duck, entity: duck, count: 1, size_reference: horse}
  expect:
    status: ok
    terrain: arena
    fighters:
      - {entity: horse, count: 100, size_reference: duck}
      - {entity: duck, count: 1, size_reference: horse}
    no_assumptions: true

- name: wolves vs moose in the forest
  text: 3 wolves vs a moose in the forest
  replies:
    - fighters:
        - {raw: 3 wolves, entity: wolf, count: 3}
        - {raw: a moose, entity: moose, count: 1}
      terrain: the forest
  expect:
    status: ok
    terrain: forest
    fighters:
      - {entity: wolf, count: 3, size_reference: null}
      - {entity: moose, count: 1}
    message_include: [3 wolves vs a moose in the forest]

- name: ant vs whale (no numbers, so 1 each with an assumption)
  text: ant vs whale
  replies:
    - fighters:
        - {raw: ant, entity: ant}
        - {raw: whale, entity: whale}
  expect:
    status: ok
    fighters:
      - {entity: ant, count: 1}
      - {entity: whale, count: 1}
    assumptions_include: [Assumed 1 ant, Assumed 1 whale]

- name: plural with no number
  text: Wolves vs a moose
  replies:
    - fighters:
        - {raw: Wolves, entity: wolves}
        - {raw: a moose, entity: moose}
  expect:
    status: ok
    fighters:
      - {entity: wolf, count: 1}
      - {entity: moose, count: 1}
    assumptions_include: [Assumed 1 wolf]

- name: vague single fighter
  text: bear
  replies:
    - fighters:
        - {raw: bear, entity: bear}
      needs_clarification:
        question: Which bear are we talking about?
        options: [grizzly bear, polar bear, black bear]
  expect:
    status: clarify
    question_include: [bear]
    options_count: 3

- name: a million ants clamped
  text: a million ants vs a lion
  replies:
    - fighters:
        - {raw: a million ants, entity: ant, count: 1000000}
        - {raw: a lion, entity: lion, count: 1}
  expect:
    status: ok
    fighters:
      - {entity: ant, count: 10000}
      - {entity: lion, count: 1}
    assumptions_include: ["10,000", "1,000,000"]

- name: digits with commas clamped
  text: 1,000,000 ants vs an elephant
