        - {raw: 6 gray wolves, entity: gray wolf, count: 6}
      terrain: a forest
      assumptions: [Assumed adult male grizzly]
  expect:
    status: ok
    terrain: forest
    fighters:
      - {entity: grizzly bear, count: 1, variant: adult male}
      - {entity: gray wolf, count: 6, variant: null}
    assumptions_include: [adult male grizzly]

