        - {raw: "1,000,000 ants", entity: ant}
        - {raw: an elephant, entity: elephant}
  expect:
    status: ok
    fighters:
      - {entity: ant, count: 10000}
      - {entity: elephant, count: 1}
    assumptions_include: ["10,000"]

